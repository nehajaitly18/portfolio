<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero — Neha Jaitly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .hero {
      width: 100%;
      max-width: 980px;
      padding: 100px 40px;
      text-align: center;
      position: relative;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(44px, 7.5vw, 90px);
      font-weight: 400;
      line-height: 1.1;
      color: #111111;
      margin-bottom: 0.44em;
    }

    .subtitle {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(20px, 3vw, 38px);
      font-weight: 400;
      line-height: 1.5;
      color: #111111;
    }

    /* ── Highlighter strokes (visible immediately, no animation) ── */
    .hl-yellow {
      background: linear-gradient(176deg, transparent 56%, rgba(255, 214, 0, 0.62) 56%);
      padding: 0 4px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    /* Thinner yellow for "I'm" in the headline */
    .hl-yellow-sm {
      background: linear-gradient(176deg, transparent 64%, rgba(255, 214, 0, 0.52) 64%);
      padding: 0 2px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    .hl-teal {
      background: linear-gradient(176deg, transparent 56%, rgba(0, 196, 175, 0.5) 56%);
      padding: 0 4px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    /* ── Doodle base ── */
    .doodle {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform-origin: center;
    }

    /* Bounce-in keyframe */
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.68); }
      to   { opacity: 1; transform: scale(1);    }
    }

    .hero.loaded #doodle-heart {
      animation: popIn 500ms cubic-bezier(0.34, 1.56, 0.64, 1) 0ms forwards;
    }
    .hero.loaded #doodle-circle {
      animation: popIn 580ms cubic-bezier(0.34, 1.56, 0.64, 1) 150ms forwards;
    }
    .hero.loaded #doodle-sparkles {
      animation: popIn 500ms cubic-bezier(0.34, 1.56, 0.64, 1) 300ms forwards;
    }

    /* Sparkles live in the top-right — no JS positioning needed */
    #doodle-sparkles {
      width: 92px;
      height: 72px;
      top: 6%;
      right: 3%;
    }
  </style>
</head>
<body>

<section class="hero" id="hero">

  <!-- ── Heart: JS-positioned right after "Hi," ── -->
  <svg id="doodle-heart" class="doodle" width="46" height="42" viewBox="0 0 46 42" fill="none">
    <path
      d="M23,12 C22.5,8 19.5,5 15.5,5.5 C10,6.4 7.5,10.5 8.4,15.2
         C9.4,21 15.5,27 23,34.5 C30.5,27 36.6,21 37.6,15.2
         C38.5,10.5 36,6.4 30.5,5.5 C26.5,5 23.5,8 23,12 Z"
      stroke="#FF6B95" stroke-width="2.3"
      fill="rgba(255,107,149,0.1)"
      stroke-linecap="round" stroke-linejoin="round"
    />
  </svg>

  <!-- ── Circle scribble: JS-positioned around "designer who" ── -->
  <svg id="doodle-circle" class="doodle" width="248" height="92" viewBox="0 0 248 92" fill="none">
    <!-- Slightly irregular closed path — not a perfect ellipse -->
    <path
      d="M26,47 C24,12 78,-5 124,3 C170,11 222,19 226,47
         C230,75 182,86 126,83 C70,80 20,78 26,47 Z"
      stroke="#FF85A8" stroke-width="5.5"
      fill="none"
      stroke-linecap="round" stroke-linejoin="round"
    />
    <!-- Tiny overlap at start for hand-drawn feel -->
    <path
      d="M26,47 C24,34 30,22 42,14"
      stroke="#FF85A8" stroke-width="5.5" stroke-opacity="0.4"
      fill="none" stroke-linecap="round"
    />
  </svg>

  <!-- ── Sparkle dashes: top-right scatter ── -->
  <svg id="doodle-sparkles" class="doodle" viewBox="0 0 92 72" fill="none">
    <line x1="6"  y1="20" x2="22" y2="13" stroke="#3DB88A" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="30" y1="6"  x2="34" y2="22" stroke="#3DB88A" stroke-width="3"   stroke-linecap="round"/>
    <line x1="47" y1="2"  x2="41" y2="18" stroke="#3DB88A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="12" x2="69" y2="25" stroke="#3DB88A" stroke-width="3"   stroke-linecap="round"/>
    <line x1="76" y1="5"  x2="82" y2="19" stroke="#3DB88A" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="14" y1="38" x2="28" y2="32" stroke="#3DB88A" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="54" y1="32" x2="59" y2="45" stroke="#3DB88A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="72" y1="36" x2="84" y2="30" stroke="#3DB88A" stroke-width="2"   stroke-linecap="round"/>
  </svg>

  <!-- Headline -->
  <h1>
    <span id="hi-word">Hi,</span>&thinsp;<span class="hl-yellow-sm">I'm</span>&thinsp;Neha
  </h1>

  <!-- Subtitle -->
  <p class="subtitle">
    I'm a visual <span id="designer-who">designer&nbsp;who</span> makes
    <span class="hl-yellow">thoughtful</span><br>
    design feel <span class="hl-teal">effortless</span>
  </p>

</section>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var hero    = document.getElementById('hero');
  var hiWord  = document.getElementById('hi-word');
  var dsgWho  = document.getElementById('designer-who');
  var heart   = document.getElementById('doodle-heart');
  var circle  = document.getElementById('doodle-circle');

  var heroRect = hero.getBoundingClientRect();

  // Heart: just to the right of and slightly above "Hi,"
  var hiRect = hiWord.getBoundingClientRect();
  heart.style.left = (hiRect.right - heroRect.left + 5) + 'px';
  heart.style.top  = (hiRect.top   - heroRect.top  - 8) + 'px';

  // Circle: centred over "designer who"
  var dwRect = dsgWho.getBoundingClientRect();
  var cw = 248, ch = 92;
  circle.style.left = (dwRect.left - heroRect.left + dwRect.width  / 2 - cw / 2) + 'px';
  circle.style.top  = (dwRect.top  - heroRect.top  + dwRect.height / 2 - ch / 2) + 'px';

  // Fire animations
  hero.classList.add('loaded');
});
</script>

</body>
</html>
